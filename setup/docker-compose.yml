services:
  localstack:
    image: localstack/localstack:3.8.1
    container_name: localstack
    restart: always
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4510-4559:4510-4559"
    environment:
      - DEBUG=1
      # 10% of DynamoDB calls fail with ProvisionedThroughputExceededException,
      # demonstrating that the AWS SDK's built-in retry handles throttling.
      - DYNAMODB_ERROR_PROBABILITY=0.1
      - SERVICES=dynamodb

  postgres:
    image: postgres:17.2-alpine
    container_name: deposit_db
    ports:
      - "6000:5432"
    environment:
      POSTGRES_USER: akash_admin
      POSTGRES_PASSWORD: akash1234
      POSTGRES_DB: deposit_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U akash_admin" ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: