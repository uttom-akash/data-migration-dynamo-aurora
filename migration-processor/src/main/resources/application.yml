spring:
  datasource:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: false
      pool-name: core-middleware-db-pool

    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6000/deposit_db
    username: akash_admin
    password: akash1234
  jpa:
    hibernate:
      ddl-auto: none  # schema is owned by Liquibase
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.jdbc.batch_versioned_data: true
    show-sql: true  # Optional: to print SQL queries in the logs
    format-sql: true  # Optional: to format the SQL output

  batch:
    job:
      enabled: false   # the job is launched once by the CommandLineRunner, not on startup
    jdbc:
      initialize-schema: always
  liquibase:
    change-log: classpath:db.changelog/master.yml
  application:
    name: "store"
dynamodb:
  endpoint-url: "http://localhost:4566"
  endpoint-region: "us-east-1"
  access-key: "test"
  access-secret-key: "test"
resource:
  prefix: "dev"

migration:
  productStepConfig:
    numberOfPartitions: 4   # TotalSegments: the table is scanned as 4 non-overlapping segments (0..3)
    chunkSize: 25           # items per transaction written to Postgres
    numberOfThreads: 4      # workers scanning segments in parallel
